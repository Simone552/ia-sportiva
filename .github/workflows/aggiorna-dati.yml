name: Aggiorna dati IA Sportiva

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_pitchapi.py"
      - "scripts/match_status.py"
      - "tests/**"
      - ".github/workflows/aggiorna-dati.yml"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: aggiorna-dati-ia-sportiva
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Verifica classificazione stato partita
        run: python -m unittest discover -s tests -v

      - name: Recupera dati da PitchAPI
        env:
          PITCH_KEY: ${{ secrets.PITCH_KEY || secrets.PITCH_API_KEY }}
        run: python scripts/fetch_pitchapi.py

      - name: Salva aggiornamento nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/partite.json data/notizie.json
          git diff --cached --quiet || git commit -m "Aggiorna dati partite"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
